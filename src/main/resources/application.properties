# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8081
spring.application.name=fastFood-backEnd

# ==========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/fast_food_db?currentSchema=app_schema
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=app_schema

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ==========================================
# SECURITY (Spring Security OAuth2 Resource Server)
# ==========================================
# C'est la seule configuration dont Spring Security a besoin pour valider les tokens JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/fastFood
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/fastFood/protocol/openid-connect/certs

# ==========================================
# KEYCLOAK ADMIN CLIENT (Propriétés personnalisées)
# ==========================================
# Attention : Spring Boot ne lit pas ces propriétés automatiquement. 
# Tu dois créer une classe @Configuration pour les injecter et instancier le KeycloakBuilder.
app.keycloak.admin.server-url=http://localhost:8080
app.keycloak.admin.realm=fastFood
app.keycloak.admin.client-id=admin-cli
app.keycloak.admin.username=dhorbani
app.keycloak.admin.password=dhorbani
# Si ton client frontend ou API nécessite un secret pour certaines opérations spécifiques (custom) :
app.keycloak.client.resource=restau
