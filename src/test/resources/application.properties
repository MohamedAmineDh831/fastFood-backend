# ==========================================
# DATABASE (H2 in-memory for tests)
# ==========================================
spring.datasource.url=jdbc:h2:mem:fastfood_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Do not use custom schemas for tests; default PUBLIC is fine
spring.jpa.properties.hibernate.default_schema=PUBLIC

# ==========================================
# LOGGING & CONTEXT
# ==========================================
# Speed up context in tests
spring.main.banner-mode=off
logging.level.org.springframework=warn

# ==========================================
# KEYCLOAK PROPERTIES (For Application Context)
# ==========================================
# Ces valeurs sont requises pour que Spring puisse créer le bean UserService.
# Si tes tests ne se connectent pas réellement à Keycloak, tu peux utiliser des valeurs fictives.
app.keycloak.admin.server-url=http://localhost:8080
app.keycloak.admin.realm=fastFood
app.keycloak.admin.client-id=admin-cli
app.keycloak.admin.username=test
app.keycloak.admin.password=test
